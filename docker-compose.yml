services:
  neo4j:
    image: neo4j:5
    environment: { NEO4J_AUTH: neo4j/sentinelpass }
    ports: ["7474:7474", "7687:7687"]
  backend:
    build: ./backend
    env_file: .env
    environment: { NEO4J_URI: bolt://neo4j:7687, NEO4J_PASSWORD: sentinelpass }
    ports: ["8000:8000"]
    depends_on: [neo4j]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["5173:5173"]
    depends_on: [backend]
